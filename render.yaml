services:
  - type: web
    name: meta-llm-selector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CREW_MODEL
        value: "gemini/gemini-2.5-flash"
      - key: CREWAI_TRACING_ENABLED
        value: "false"
      # Set these manually in the Render dashboard (never commit real keys)
      - key: GEMINI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
